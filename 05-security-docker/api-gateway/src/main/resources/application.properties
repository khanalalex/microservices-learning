spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Route 1: /api/products/** -> product-service
spring.cloud.gateway.server.webflux.routes[0].id=product-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/products/**

# Route 2: /api/orders/** -> order-service
spring.cloud.gateway.server.webflux.routes[1].id=order-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**

eureka.instance.prefer-ip-address=true

management.tracing.sampling.probability=1.0
spring.reactor.context-propagation=auto

# JWT (must match auth-service)
jwt.secret=${JWT_SECRET:demo-secret-key-change-me-at-least-32-bytes-long}

# Route 3: /auth/** -> auth-service
spring.cloud.gateway.server.webflux.routes[2].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/auth/**
