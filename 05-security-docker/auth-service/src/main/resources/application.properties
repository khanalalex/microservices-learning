spring.application.name=auth-service
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Secret used to sign tokens. At least 32 characters for HS256.
# The default is for local demos only. Real deployments set JWT_SECRET from outside.
jwt.secret=${JWT_SECRET:demo-secret-key-change-me-at-least-32-bytes-long}
jwt.expiration-minutes=30
